<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Koyori — แผนที่ครูช่าง</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+Thai:wght@400;600;700&family=Sarabun:wght@300;400;500;600&family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --red:#C0392B;--red2:#E74C3C;--navy:#1A2A5E;--navy2:#2541A8;
  --white:#fff;--offwhite:#F8F9FF;--light:#EEF1FB;
  --text:#1A1A2E;--muted:#6B7394;--border:#D8DCF0;
}
body,html{height:100%;font-family:'Sarabun',sans-serif;background:var(--offwhite)}

/* HEADER */
header{background:var(--navy);position:relative}
.hero-stripe{background:var(--red);height:5px;width:100%}
.header-inner{
  max-width:none;padding:.7rem 1.5rem;
  display:flex;align-items:center;gap:1rem;flex-wrap:wrap;
}
.header-logo{
  width:38px;height:38px;object-fit:contain;
  filter:drop-shadow(0 1px 4px rgba(0,0,0,.3));
}
.header-logo-fallback{
  width:38px;height:38px;border-radius:50%;
  background:linear-gradient(135deg,var(--red),var(--navy2));
  display:flex;align-items:center;justify-content:center;
  font-family:'Montserrat',sans-serif;font-weight:700;font-size:.8rem;color:#fff;
}
.header-title{
  font-family:'Noto Serif Thai',serif;font-weight:700;
  font-size:1rem;color:#fff;line-height:1.2;
}
.header-sub{font-size:.72rem;color:rgba(255,255,255,0.55)}
.nav-links{display:flex;gap:.4rem;margin-left:auto;flex-wrap:wrap}
.nav-btn{
  display:inline-flex;align-items:center;gap:.3rem;
  padding:.35rem .8rem;border-radius:6px;font-size:.75rem;
  text-decoration:none;font-family:'Montserrat',sans-serif;font-weight:600;
  transition:all .2s;
}
.nav-btn-active{background:var(--red);color:#fff}
.nav-btn-ghost{color:rgba(255,255,255,.7);background:transparent}
.nav-btn-ghost:hover{background:rgba(255,255,255,.12);color:#fff}

/* MAP */
#map{position:fixed;top:0;left:0;right:0;bottom:0;z-index:0}
header{position:relative;z-index:500}

/* POPUP */
.leaflet-popup-content-wrapper{
  border-radius:12px;border-top:5px solid var(--red);
  box-shadow:0 8px 30px rgba(26,42,94,.2);
  font-family:'Sarabun',sans-serif;padding:0;overflow:hidden;
}
.leaflet-popup-content{width:300px!important;margin:0;font-size:14px}
.popup-header{
  background:var(--navy);color:#fff;
  padding:.65rem 1rem;
}
.popup-prov{
  font-family:'Montserrat',sans-serif;font-weight:700;
  font-size:.85rem;letter-spacing:.02em;
}
.popup-count{
  font-size:.68rem;color:rgba(255,255,255,.6);
  margin-top:.1rem;
}
.popup-body{padding:.6rem .8rem .8rem;max-height:320px;overflow-y:auto}
.artisan-item{
  padding:.55rem 0;border-bottom:1px dashed var(--border);
}
.artisan-item:last-child{border:none}
.artisan-name{
  font-family:'Noto Serif Thai',serif;font-weight:600;
  color:var(--navy);font-size:.88rem;display:block;
}
.artisan-en{color:var(--muted);font-size:.7rem;display:block;margin-bottom:.2rem}
.artisan-cat{
  background:#FEF3F2;color:var(--red);
  padding:.12rem .45rem;border-radius:20px;
  font-size:.65rem;display:inline-block;margin-bottom:.3rem;font-weight:600;
}
.artisan-links{display:flex;gap:.35rem;flex-wrap:wrap;margin-top:.3rem}
.artisan-link{
  color:var(--navy2);text-decoration:none;font-size:.68rem;
  display:inline-flex;align-items:center;gap:.25rem;font-weight:500;
  padding:.12rem .4rem;background:var(--light);border-radius:4px;
  transition:all .15s;
}
.artisan-link:hover{background:var(--navy2);color:#fff}
.artisan-link.fb{background:#FEF3F2;color:var(--red)}
.artisan-link.fb:hover{background:var(--red);color:#fff}

/* LEGEND */
.legend{
  position:fixed;bottom:1.5rem;left:1rem;z-index:500;
  background:rgba(255,255,255,.97);backdrop-filter:blur(8px);
  border-radius:10px;padding:.8rem 1rem;
  box-shadow:0 4px 20px rgba(26,42,94,.15);
  border:1px solid var(--border);
  font-size:.75rem;color:var(--text);min-width:140px;
}
.legend-title{
  font-family:'Montserrat',sans-serif;font-weight:700;
  color:var(--navy);margin-bottom:.5rem;font-size:.78rem;
  display:flex;align-items:center;gap:.35rem;
}
.legend-row{display:flex;align-items:center;gap:.5rem;margin-bottom:.25rem}
.legend-dot{
  border-radius:50%;background:var(--navy);
  border:2px solid var(--red);flex-shrink:0;opacity:.85;
}

/* ── PROVINCE LABELS ── */
.prov-label{
  background:transparent!important;border:none!important;box-shadow:none!important;
}
.prov-label-inner{
  font-family:'Prompt',sans-serif;font-weight:700;font-size:.82rem;
  color:var(--navy);text-shadow:1px 1px 0 #fff,-1px -1px 0 #fff,1px -1px 0 #fff,-1px 1px 0 #fff,0 2px 4px rgba(0,0,0,.15);
  white-space:nowrap;pointer-events:none;
}

/* ── ARTISAN CARD in POPUP ── */
.artisan-card{
  display:flex;align-items:center;gap:.6rem;
  padding:.5rem 0;border-bottom:1px dashed var(--border);
  cursor:pointer;transition:background .15s;border-radius:6px;
  padding:.45rem .5rem;margin:0 -.5rem;
}
.artisan-card:last-child{border:none}
.artisan-card:hover{background:var(--light)}
.artisan-thumb{
  width:44px;height:44px;border-radius:8px;object-fit:cover;
  flex-shrink:0;background:var(--light);border:1px solid var(--border);
}
.artisan-thumb-placeholder{
  width:44px;height:44px;border-radius:8px;flex-shrink:0;
  background:linear-gradient(135deg,var(--navy),var(--navy2));
  display:flex;align-items:center;justify-content:center;
  font-family:'Montserrat',sans-serif;font-weight:700;font-size:.9rem;color:#fff;
}
.artisan-info{flex:1;min-width:0}
.artisan-name{font-family:'Noto Serif Thai',serif;font-weight:600;color:var(--navy);font-size:.85rem;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.artisan-en{color:var(--muted);font-size:.68rem;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.artisan-cat{background:#FEF3F2;color:var(--red);padding:.1rem .4rem;border-radius:20px;font-size:.62rem;display:inline-block;font-weight:600;margin-top:.15rem}
.artisan-arrow{color:var(--muted);font-size:.8rem;flex-shrink:0}

/* ── SIDE PANEL ── */
.side-panel{
  position:fixed;top:49px;right:0;bottom:0;width:340px;
  background:#fff;border-left:1px solid var(--border);
  z-index:400;transform:translateX(100%);transition:transform .3s;
  display:flex;flex-direction:column;
  box-shadow:-4px 0 20px rgba(0,0,0,.1);
}
.side-panel.open{transform:translateX(0)}
.side-panel-top{height:4px;background:linear-gradient(90deg,var(--navy),var(--red))}
.side-panel-header{
  padding:.9rem 1rem;border-bottom:1px solid var(--border);
  display:flex;align-items:center;justify-content:space-between;
}
.side-panel-title{font-family:'Prompt',sans-serif;font-weight:600;color:var(--navy);font-size:.95rem}
.side-panel-close{background:none;border:none;cursor:pointer;color:var(--muted);font-size:1.1rem;padding:.2rem .4rem;border-radius:4px}
.side-panel-close:hover{color:var(--red)}
.side-panel-imgs{display:grid;grid-template-columns:1fr 1fr;height:200px;overflow:hidden;background:#F0F3FF}
.side-panel-imgs.single{grid-template-columns:1fr}
.side-panel-img{width:100%;height:200px;object-fit:cover}
.side-panel-img-lbl{font-size:.6rem;font-family:'Montserrat',sans-serif;color:var(--muted);text-align:center;padding:.25rem;background:#F0F3FF;text-transform:uppercase;letter-spacing:.05em}
.side-panel-body{padding:1rem;overflow-y:auto;flex:1}
.side-panel-name{font-family:'Noto Serif Thai',serif;font-weight:700;font-size:1.1rem;color:var(--navy)}
.side-panel-en{font-size:.75rem;color:var(--muted);margin-bottom:.6rem;display:block}
.side-panel-tags{display:flex;flex-wrap:wrap;gap:.3rem;margin-bottom:.75rem}
.side-panel-contacts{display:flex;flex-wrap:wrap;gap:.4rem;padding-top:.75rem;border-top:1px solid var(--border)}
</style>
</head>

      <div class="header-sub">Koyori Artisan Map · Northern Thailand</div>
    </div>
    <div class="nav-links">
      <a href="index.html" class="nav-btn nav-btn-ghost">🗂️ Directory</a>
      <a href="map.html"   class="nav-btn nav-btn-active">🗺️ Map</a>
    </div>
  </div>
</header>

<div id="map"></div>

<div class="legend">
  <div class="legend-title">⬤ จำนวนช่าง</div>

    <div class="legend-dot" style="width:18px;height:18px"></div>

  <div class="legend-row">
    <div class="legend-dot" style="width:10px;height:10px"></div>

  </div>
</div>

  });

  var popup = '<div class="popup-header">'
    +'<div class="popup-prov">'+data.province+'</div>'
    +'<div class="popup-count">'+data.count+' ครูช่าง</div>'
    +'</div><div class="popup-body">'+body+'</div>';

  circle.bindPopup(popup, {maxWidth:320, maxHeight:440});
});

// Side panel
function openSidePanel(pid, a){
  var imgData = IMGS[pid] || {};
  var portrait = imgData.portrait || null;
  var product  = imgData.product  || null;

  var si = document.getElementById('spImgs');
  if(portrait && product){
    si.className='side-panel-imgs';
    si.innerHTML='<div><img class="side-panel-img" src="'+portrait+'" onerror="this.parentNode.style.display=\'none\'"><div class="side-panel-img-lbl">ครูช่าง</div></div>'
      +'<div><img class="side-panel-img" src="'+product+'" onerror="this.parentNode.style.display=\'none\'"><div class="side-panel-img-lbl">ผลงาน</div></div>';
  } else if(portrait||product){
    si.className='side-panel-imgs single';
    si.innerHTML='<div><img class="side-panel-img" src="'+(portrait||product)+'"><div class="side-panel-img-lbl">'+(portrait?'ครูช่าง':'ผลงาน')+'</div></div>';
  } else {
    si.className='side-panel-imgs single';
    si.innerHTML='<div style="display:flex;align-items:center;justify-content:center;height:200px;color:#aaa;font-size:.8rem">ยังไม่มีรูปภาพ</div>';
  }

  document.getElementById('spName').textContent = a.nameTh||a.nameEn||'';
  document.getElementById('spNameEn').textContent = (a.nameEn&&a.nameTh)?a.nameEn:'';

  var tags='';
  if(a.province) tags+='<span class="tag tag-prov">&#128205; '+a.province+'</span>';
  if(a.category) tags+='<span class="tag tag-cat">'+a.category+'</span>';
  if(pid) tags+='<span class="tag tag-id">'+pid+'</span>';
  document.getElementById('spTags').innerHTML=tags;

  var c='';
  if(a.link) c+='<a href="'+a.link+'" target="_blank" class="contact-btn btn-map">&#128506; แผนที่</a>';
  if(a.link2&&a.link2.indexOf('http')===0) c+='<a href="'+a.link2+'" target="_blank" class="contact-btn btn-fb">&#128216; Facebook</a>';
  document.getElementById('spContacts').innerHTML=c;
  document.getElementById('spContacts').style.display=c?'flex':'none';

  document.getElementById('sidePanel').classList.add('open');
}
function closeSidePanel(){
  document.getElementById('sidePanel').classList.remove('open');
}
</script>

<!-- SIDE PANEL -->
<div class="side-panel" id="sidePanel">
  <div class="side-panel-top"></div>
  <div class="side-panel-header">
    <div class="side-panel-title" id="spName"></div>
    <button class="side-panel-close" onclick="closeSidePanel()">&#x2715;</button>
  </div>
  <div class="side-panel-imgs" id="spImgs"></div>
  <div class="side-panel-body">
    <div class="side-panel-en" id="spNameEn"></div>
    <div class="side-panel-tags" id="spTags"></div>
    <div class="side-panel-contacts" id="spContacts"></div>
  </div>
</div>
</body>
</html>
