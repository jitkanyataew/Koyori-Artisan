<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --red:#C0392B;--red2:#E74C3C;--navy:#1A2A5E;--navy2:#2541A8;
  --white:#fff;--offwhite:#F8F9FF;--light:#EEF1FB;
  --text:#1A1A2E;--muted:#6B7394;--border:#D8DCF0;
}
body,html{height:100%;font-family:'Sarabun',sans-serif;background:var(--offwhite)}

/* HEADER */
header{background:var(--navy);position:relative}
.hero-stripe{background:var(--red);height:5px;width:100%}
.header-inner{
  max-width:none;padding:.7rem 1.5rem;
  display:flex;align-items:center;gap:1rem;flex-wrap:wrap;
}
.header-logo{
  width:38px;height:38px;object-fit:contain;
  filter:drop-shadow(0 1px 4px rgba(0,0,0,.3));
}
.header-logo-fallback{
  width:38px;height:38px;border-radius:50%;
  background:linear-gradient(135deg,var(--red),var(--navy2));
  display:flex;align-items:center;justify-content:center;
  font-family:'Montserrat',sans-serif;font-weight:700;font-size:.8rem;color:#fff;
}
.header-title{
  font-family:'Noto Serif Thai',serif;font-weight:700;
  font-size:1rem;color:#fff;line-height:1.2;
}
.header-sub{font-size:.72rem;color:rgba(255,255,255,0.55)}
.nav-links{display:flex;gap:.4rem;margin-left:auto;flex-wrap:wrap}
.nav-btn{
  display:inline-flex;align-items:center;gap:.3rem;
  padding:.35rem .8rem;border-radius:6px;font-size:.75rem;
  text-decoration:none;font-family:'Montserrat',sans-serif;font-weight:600;
  transition:all .2s;
}
.nav-btn-active{background:var(--red);color:#fff}
.nav-btn-ghost{color:rgba(255,255,255,.7);background:transparent}
.nav-btn-ghost:hover{background:rgba(255,255,255,.12);color:#fff}

/* MAP */
#map{position:fixed;top:0;left:0;right:0;bottom:0;z-index:0}
header{position:relative;z-index:500}

/* POPUP */
.leaflet-popup-content-wrapper{
  border-radius:12px;border-top:5px solid var(--red);
  box-shadow:0 8px 30px rgba(26,42,94,.2);
  font-family:'Sarabun',sans-serif;padding:0;overflow:hidden;
}
.leaflet-popup-content{width:300px!important;margin:0;font-size:14px}
.popup-header{
  background:var(--navy);color:#fff;
  padding:.65rem 1rem;
}
.popup-prov{
  font-family:'Montserrat',sans-serif;font-weight:700;
  font-size:.85rem;letter-spacing:.02em;
}
.popup-count{
  font-size:.68rem;color:rgba(255,255,255,.6);
  margin-top:.1rem;
}
.popup-body{padding:.6rem .8rem .8rem;max-height:320px;overflow-y:auto}
.artisan-item{
  padding:.55rem 0;border-bottom:1px dashed var(--border);
}
.artisan-item:last-child{border:none}
.artisan-name{
  font-family:'Noto Serif Thai',serif;font-weight:600;
  color:var(--navy);font-size:.88rem;display:block;
}
.artisan-en{color:var(--muted);font-size:.7rem;display:block;margin-bottom:.2rem}
.artisan-cat{
  background:#FEF3F2;color:var(--red);
  padding:.12rem .45rem;border-radius:20px;
  font-size:.65rem;display:inline-block;margin-bottom:.3rem;font-weight:600;
}
.artisan-links{display:flex;gap:.35rem;flex-wrap:wrap;margin-top:.3rem}
.artisan-link{
  color:var(--navy2);text-decoration:none;font-size:.68rem;
  display:inline-flex;align-items:center;gap:.25rem;font-weight:500;
  padding:.12rem .4rem;background:var(--light);border-radius:4px;
  transition:all .15s;
}
.artisan-link:hover{background:var(--navy2);color:#fff}
.artisan-link.fb{background:#FEF3F2;color:var(--red)}
.artisan-link.fb:hover{background:var(--red);color:#fff}

/* LEGEND */
.legend{
  position:fixed;bottom:1.5rem;left:1rem;z-index:500;
  background:rgba(255,255,255,.97);backdrop-filter:blur(8px);
  border-radius:10px;padding:.8rem 1rem;
  box-shadow:0 4px 20px rgba(26,42,94,.15);
  border:1px solid var(--border);
  font-size:.75rem;color:var(--text);min-width:140px;
}
.legend-title{
  font-family:'Montserrat',sans-serif;font-weight:700;
  color:var(--navy);margin-bottom:.5rem;font-size:.78rem;
  display:flex;align-items:center;gap:.35rem;
}
.legend-row{display:flex;align-items:center;gap:.5rem;margin-bottom:.25rem}
.legend-dot{
  border-radius:50%;background:var(--navy);
  border:2px solid var(--red);flex-shrink:0;opacity:.85;
}
</style>

<div id="map"></div>

</div>

provinceData.forEach(function(data){
  var sz = data.count > 25 ? 20 : data.count >= 10 ? 14 : 10;
  var circle = L.circleMarker([data.lat, data.lng],{
    radius: sz,
    fillColor: '#1A2A5E',
    color: '#C0392B',
    weight: 2.5,
    opacity: 1,
    fillOpacity: 0.85
  }).addTo(map);

  var body = '';
  data.artisans.forEach(function(a){
    var fbLink = a.link2 && a.link2.startsWith('http') ?
      '<a href="'+a.link2+'" target="_blank" class="artisan-link fb">📘 FB</a>' : '';
    body += '<div class="artisan-item">';
    body += '<span class="artisan-name">'+(a.nameTh||a.nameEn||'')+'</span>';
    if(a.nameEn && a.nameTh && a.nameEn!==a.nameTh)
      body += '<span class="artisan-en">'+a.nameEn+'</span>';
    if(a.category) body += '<span class="artisan-cat">'+a.category+'</span><br>';
    body += '<div class="artisan-links">';
    if(a.link) body += '<a href="'+a.link+'" target="_blank" class="artisan-link">🗺️ แผนที่</a>';
    body += fbLink;
    body += '</div></div>';
  });

  var popup = '<div class="popup-header">'
    +'<div class="popup-prov">'+data.province+'</div>'
    +'<div class="popup-count">'+data.count+' ครูช่าง · artisans</div>'
    +'</div><div class="popup-body">'+body+'</div>';

  circle.bindPopup(popup,{maxWidth:320,maxHeight:420});
  circle.bindTooltip(data.province+' ('+data.count+')',{
    permanent:false,direction:'top',className:'',offset:[0,-sz]
  });
});
