<meta charset="UTF-8">

<title>แผนที่ครูช่าง | Koyori Artisan Map</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600&family=Prompt:wght@300;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --cream:#FFFFFF;--warm:#D0D9F0;--terracotta:#CC1133;--indigo:#1A3A8F;
  --teal:#0D47A1;--gold:#CC1133;--text:#1A1A2E;--muted:#6670A0;--light:#EEF2FF;
}
body{font-family:'Sarabun',sans-serif;background:#F5F7FF;color:var(--text);min-height:100vh;display:flex;flex-direction:column}

/* NAV BAR */
.top-nav{background:linear-gradient(135deg,#1A3A8F 0%,#1E4FBF 55%,#0D47A1 100%);padding:.9rem 1.5rem;position:relative;overflow:hidden}
.top-nav::before{content:'';position:absolute;width:280px;height:280px;border-radius:50%;background:rgba(255,255,255,0.05);right:-60px;top:-100px;pointer-events:none}
.top-nav::after{content:'';position:absolute;width:160px;height:160px;border-radius:50%;background:rgba(204,17,51,0.1);left:-30px;bottom:-50px;pointer-events:none}
.nav-bg-logo{position:absolute;right:-20px;top:50%;transform:translateY(-50%);width:140px;height:140px;object-fit:contain;opacity:0.1;pointer-events:none;filter:brightness(2) contrast(0.8)}
@media(min-width:600px){.nav-bg-logo{width:180px;height:180px;right:10px}}
.nav-bg-spiral{position:absolute;left:-20px;top:50%;transform:translateY(-50%);width:100px;height:100px;object-fit:contain;opacity:0.08;pointer-events:none;filter:brightness(2) contrast(0.7)}
@media(min-width:600px){.nav-bg-spiral{width:130px;height:130px;left:0}}
.nav-inner{max-width:1200px;margin:0 auto;display:flex;align-items:center;gap:1rem;position:relative;flex-wrap:wrap;z-index:1}
.nav-logo{display:flex;align-items:center;gap:.6rem;text-decoration:none}
.nav-logo img{width:36px;height:36px;border-radius:9px;object-fit:cover}
.nav-title{font-family:'Prompt',sans-serif;font-size:.82rem;font-weight:600;color:rgba(255,255,255,0.92);letter-spacing:.08em}
.nav-links{display:flex;gap:.5rem;margin-left:auto}
.nav-links a{font-size:.8rem;color:rgba(255,255,255,0.7);text-decoration:none;padding:.4rem .9rem;border-radius:20px;transition:all .2s;font-weight:500}
.nav-links a:hover,.nav-links a.active{background:rgba(255,255,255,0.15);color:#fff}
.page-title{text-align:center;padding:1.2rem 1rem .8rem;font-family:'Prompt',sans-serif}
.page-title h1{font-size:clamp(1.1rem,3vw,1.5rem);color:var(--indigo);font-weight:500}
.page-title p{font-size:.82rem;color:var(--muted);margin-top:.25rem}

/* MAP */
#map{flex:1;min-height:500px;border-radius:0;z-index:1}
.map-wrap{flex:1;display:flex;flex-direction:column;padding:0 1rem 1rem;max-width:1200px;width:100%;margin:0 auto}
.map-container{flex:1;border-radius:18px;overflow:hidden;border:1.5px solid var(--warm);box-shadow:0 4px 24px rgba(26,58,143,.1);min-height:500px;position:relative}

/* LEGEND */
.legend{display:flex;flex-wrap:wrap;gap:.5rem;justify-content:center;padding:.8rem 1rem}
.legend-item{display:flex;align-items:center;gap:.3rem;font-size:.72rem;color:var(--muted);background:#fff;padding:.3rem .65rem;border-radius:14px;border:1px solid var(--warm)}
.legend-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}

/* POPUP STYLES */
.leaflet-popup-content-wrapper{border-radius:14px!important;box-shadow:0 6px 24px rgba(26,58,143,.15)!important;border:1px solid var(--warm)!important}
.leaflet-popup-content{font-family:'Sarabun',sans-serif!important;padding:0!important;margin:0!important;min-width:220px;max-width:300px}
.popup-header{background:linear-gradient(135deg,#1A3A8F,#0D47A1);color:#fff;padding:.7rem .9rem;border-radius:14px 14px 0 0;font-family:'Prompt',sans-serif;font-size:.85rem;font-weight:500;display:flex;align-items:center;gap:.4rem}
.popup-count{background:rgba(255,255,255,0.2);padding:.15rem .5rem;border-radius:10px;font-size:.72rem;font-weight:600;margin-left:auto}
.popup-list{padding:.5rem .7rem;max-height:280px;overflow-y:auto}
.popup-artisan{padding:.4rem .2rem;border-bottom:1px solid #f0f2ff;font-size:.78rem;display:flex;align-items:flex-start;gap:.4rem}
.popup-artisan:last-child{border-bottom:none}
.popup-artisan-cat{font-size:.62rem;color:var(--teal);background:var(--light);padding:.1rem .4rem;border-radius:8px;white-space:nowrap;flex-shrink:0;margin-top:.1rem}
.popup-artisan-info{flex:1;min-width:0}
.popup-artisan-name{color:var(--indigo);font-weight:500}
.popup-artisan-name-en{color:var(--muted);font-size:.7rem}
.popup-artisan-link{color:var(--terracotta);text-decoration:none;font-size:.7rem;display:inline-flex;align-items:center;gap:.2rem}
.popup-artisan-link:hover{text-decoration:underline}

/* STATS BAR */
.map-stats{display:flex;justify-content:center;flex-wrap:wrap;gap:.6rem;padding:.6rem 1rem;align-items:center}
.map-stat{display:flex;align-items:center;gap:.35rem;background:#fff;border:1.5px solid var(--warm);border-radius:50px;padding:.35rem .9rem;font-family:'Prompt',sans-serif;font-size:.78rem;color:var(--indigo);font-weight:500;box-shadow:0 1px 6px rgba(26,58,143,.06)}
.map-stat .stat-icon{font-size:.9rem}
.map-stat .stat-num{font-weight:600;color:var(--terracotta)}

/* FILTERS */
.map-filters{display:flex;justify-content:center;flex-wrap:wrap;gap:.5rem;padding:0 1rem .6rem;align-items:center}
.map-filter-select{padding:.4rem .8rem;border:1.5px solid var(--warm);border-radius:20px;font-family:'Sarabun',sans-serif;font-size:.8rem;background:#fff;color:var(--text);outline:none;cursor:pointer;transition:border-color .2s,box-shadow .2s}
.map-filter-select:focus{border-color:var(--indigo);box-shadow:0 0 0 3px rgba(26,58,143,.1)}
.map-search-wrap{position:relative;min-width:180px}
.map-search-wrap input{width:100%;padding:.4rem .7rem .4rem 2rem;border:1.5px solid var(--warm);border-radius:20px;font-family:'Sarabun',sans-serif;font-size:.8rem;background:#fff;color:var(--text);outline:none;transition:border-color .2s,box-shadow .2s}
.map-search-wrap input:focus{border-color:var(--indigo);box-shadow:0 0 0 3px rgba(26,58,143,.1)}
.map-search-icon{position:absolute;left:.65rem;top:50%;transform:translateY(-50%);color:var(--muted);font-size:.75rem;pointer-events:none}
.map-reset-btn{display:inline-flex;align-items:center;gap:.3rem;background:var(--light);color:var(--indigo);border:1.5px solid var(--warm);border-radius:20px;padding:.35rem .8rem;font-family:'Sarabun',sans-serif;font-size:.78rem;cursor:pointer;transition:all .2s;font-weight:500}
.map-reset-btn:hover{background:var(--indigo);color:#fff;border-color:var(--indigo)}

/* FOOTER */
footer{text-align:center;padding:1.2rem 1.5rem;font-size:.75rem;color:var(--muted);border-top:1px solid var(--warm);background:linear-gradient(180deg,#fff 0%,#F5F7FF 100%);position:relative;overflow:hidden}
.footer-spiral{position:absolute;right:-25px;top:50%;transform:translateY(-50%);width:80px;height:80px;object-fit:contain;opacity:.08;pointer-events:none}
.footer-spiral-left{position:absolute;left:-25px;top:50%;transform:translateY(-50%);width:80px;height:80px;object-fit:contain;opacity:.08;pointer-events:none}
@media(min-width:600px){.footer-spiral,.footer-spiral-left{width:110px;height:110px}}
.footer-brand{font-family:'Prompt',sans-serif;font-size:.82rem;font-weight:500;color:var(--indigo);margin-bottom:.3rem}

/* CUSTOM MARKER */
.province-marker{background:linear-gradient(135deg,#1A3A8F,#0D47A1);color:#fff;border-radius:50%;width:44px;height:44px;display:flex;align-items:center;justify-content:center;font-family:'Prompt',sans-serif;font-weight:600;font-size:.85rem;box-shadow:0 3px 12px rgba(26,58,143,.35);border:3px solid #fff;cursor:pointer;transition:transform .2s}
.province-marker:hover{transform:scale(1.15)}
.province-marker.large{width:56px;height:56px;font-size:1rem}

@media(max-width:520px){
  .nav-inner{gap:.5rem}
  .nav-links a{padding:.3rem .6rem;font-size:.75rem}
  .map-wrap{padding:0 .5rem .5rem}
  .map-container{min-height:400px;border-radius:12px}
  .map-stats{gap:.4rem;padding:.5rem .5rem}
  .map-stat{padding:.25rem .6rem;font-size:.72rem}
  .map-filters{gap:.4rem;padding:0 .5rem .5rem}
  .map-filter-select{font-size:.75rem;padding:.35rem .6rem}
  .map-search-wrap{min-width:140px;flex:1}
  .map-search-wrap input{font-size:.75rem;padding:.35rem .6rem .35rem 1.7rem}
}
</style>
</head>

const categories = {};
const allProvinces = new Set();
const allYears = new Set();
DATA.forEach(a => {
  if (a.cat_id && a.cat_th) categories[a.cat_id] = a.cat_th;
  if (a.prov_th) allProvinces.add(a.prov_th);
  if (a.year) allYears.add(a.year);
});

document.getElementById('mapStatArtisans').textContent = DATA.length;
document.getElementById('mapStatProvinces').textContent = allProvinces.size;
document.getElementById('mapStatCategories').textContent = Object.keys(categories).length;
document.getElementById('mapStatYears').textContent = allYears.size;

const filterProv = document.getElementById('filterProvince');
const filterCat = document.getElementById('filterCategory');
const filterYear = document.getElementById('filterYear');
const mapSearch = document.getElementById('mapSearch');

[...allProvinces].sort().forEach(p => {
  const en = PROVINCE_COORDS[p] ? PROVINCE_COORDS[p].en : '';
  filterProv.innerHTML += `<option value="${p}">${p}${en ? ' · '+en : ''}</option>`;
});
Object.entries(categories).sort((a,b)=>a[0].localeCompare(b[0])).forEach(([id,name]) => {
  filterCat.innerHTML += `<option value="${id}">${name}</option>`;
});
[...allYears].sort().forEach(y => {
  filterYear.innerHTML += `<option value="${y}">${y}</option>`;
});

const map = L.map('map',{zoomControl:true,scrollWheelZoom:true}).setView([18.8,99.3],8);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{
  attribution:'&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>',
  maxZoom:18
}).addTo(map);

let markers = [];

function renderMarkers(filteredData) {
  markers.forEach(m => map.removeLayer(m));
  markers = [];

  const grouped = {};
  filteredData.forEach(a => {
    const prov = a.prov_th || '';
    if (!prov || !PROVINCE_COORDS[prov]) return;
    if (!grouped[prov]) grouped[prov] = [];
    grouped[prov].push(a);
  });

  Object.entries(grouped).forEach(([prov, artisans]) => {
    const coords = PROVINCE_COORDS[prov];
    if (!coords) return;

    const isLarge = artisans.length > 25;
    const icon = L.divIcon({
      className:'',
      html:`<div class="province-marker${isLarge?' large':''}">${artisans.length}</div>`,
      iconSize:[isLarge?56:44, isLarge?56:44],
      iconAnchor:[isLarge?28:22, isLarge?28:22],
      popupAnchor:[0, isLarge?-30:-24]
    });

    const artisanList = artisans.map(a => {
      const mapLink = a.map ? `<a class="popup-artisan-link" href="${a.map}" target="_blank" rel="noopener">🗺️ แผนที่</a>` : '';
      return `<div class="popup-artisan">
        <span class="popup-artisan-cat">${a.cat_th||''}</span>
        <div class="popup-artisan-info">
          <div class="popup-artisan-name">${a.name_th||''}</div>
          <div class="popup-artisan-name-en">${a.name_en||''} ${mapLink}</div>
        </div>
      </div>`;
    }).join('');

    const popup = `<div>
      <div class="popup-header">📍 ${prov} · ${coords.en}<span class="popup-count">${artisans.length} คน</span></div>
      <div class="popup-list">${artisanList}</div>
    </div>`;

    const marker = L.marker([coords.lat, coords.lng], {icon})
      .addTo(map)
      .bindPopup(popup, {maxWidth:320, maxHeight:400});
    markers.push(marker);
  });

  const provCount = Object.keys(grouped).length;
  const catSet = new Set(filteredData.map(a=>a.cat_id).filter(Boolean));
  document.getElementById('mapStatArtisans').textContent = filteredData.length;
  document.getElementById('mapStatProvinces').textContent = provCount;
  document.getElementById('mapStatCategories').textContent = catSet.size;

  if (filteredData.length > 0 && filteredData.length < DATA.length) {
    const bounds = markers.map(m => m.getLatLng());
    if (bounds.length === 1) {
      map.setView(bounds[0], 10);
    } else if (bounds.length > 1) {
      map.fitBounds(L.latLngBounds(bounds), {padding:[40,40]});
    }
  }
}

function applyFilters() {
  const prov = filterProv.value;
  const cat = filterCat.value;
  const year = filterYear.value;
  const search = mapSearch.value.trim().toLowerCase();

  let filtered = DATA;
  if (prov) filtered = filtered.filter(a => a.prov_th === prov);
  if (cat) filtered = filtered.filter(a => a.cat_id === cat);
  if (year) filtered = filtered.filter(a => String(a.year) === year);
  if (search) filtered = filtered.filter(a =>
    (a.name_th||'').toLowerCase().includes(search) ||
    (a.name_en||'').toLowerCase().includes(search) ||
    (a.cat_th||'').toLowerCase().includes(search)
  );

  renderMarkers(filtered);
}

filterProv.addEventListener('change', applyFilters);
filterCat.addEventListener('change', applyFilters);
filterYear.addEventListener('change', applyFilters);
mapSearch.addEventListener('input', applyFilters);

document.getElementById('resetFilters').addEventListener('click', () => {
  filterProv.value = '';
  filterCat.value = '';
  filterYear.value = '';
  mapSearch.value = '';
  renderMarkers(DATA);
  map.setView([18.8,99.3],8);
});

renderMarkers(DATA);

const legendEl = document.getElementById('legend');
const catEntries = Object.entries(categories).sort((a,b) => a[0].localeCompare(b[0]));
legendEl.innerHTML = catEntries.map(([id, name]) =>
  `<div class="legend-item"><span class="legend-dot" style="background:${CAT_COLORS[id]||'#888'}"></span>${name}</div>`
).join('');
</script>
