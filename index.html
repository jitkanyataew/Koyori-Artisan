<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Koyori Artisan Directory | ทำเนียบช่างฝีมือโคยูริ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600&family=Prompt:wght@300;500;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --cream:#FAF7F2;--warm:#E8DFD0;--terracotta:#B5613A;--indigo:#2C3E6B;
  --teal:#1E6B5A;--gold:#C49A3C;--text:#2A2520;--muted:#7A6E65;--light:#F5EFE8;
}
body{font-family:'Sarabun',sans-serif;background:var(--cream);color:var(--text);min-height:100vh}
/* HEADER */
header{background:var(--indigo);padding:2rem 1.5rem 1.5rem;position:relative;overflow:hidden}
header::before{content:'';position:absolute;inset:0;background:radial-gradient(ellipse at 80% 50%,rgba(196,154,60,0.15) 0%,transparent 60%)}
.header-inner{max-width:960px;margin:0 auto;position:relative}
.logo-row{display:flex;align-items:center;gap:1rem;margin-bottom:.5rem}
.logo-dot{width:10px;height:10px;border-radius:50%;background:var(--gold)}
h1{font-family:'Prompt',sans-serif;font-size:clamp(1.4rem,4vw,2rem);font-weight:500;color:#fff;line-height:1.2}
.subtitle{font-size:.85rem;color:rgba(255,255,255,0.65);margin-top:.25rem;letter-spacing:.03em}
.stats-row{display:flex;gap:1.5rem;margin-top:1.2rem;flex-wrap:wrap}
.stat{color:rgba(255,255,255,0.85);font-size:.82rem}
.stat strong{color:var(--gold);font-size:1.1rem;display:block;font-family:'Prompt',sans-serif}
/* CONTROLS */
.controls{background:#fff;border-bottom:1px solid var(--warm);padding:1rem 1.5rem;position:sticky;top:0;z-index:100;box-shadow:0 2px 12px rgba(0,0,0,.06)}
.controls-inner{max-width:960px;margin:0 auto;display:flex;flex-wrap:wrap;gap:.75rem;align-items:center}
.search-wrap{position:relative;flex:1;min-width:200px}
.search-wrap input{width:100%;padding:.6rem .75rem .6rem 2.4rem;border:1.5px solid var(--warm);border-radius:8px;font-family:'Sarabun',sans-serif;font-size:.9rem;background:var(--cream);color:var(--text);outline:none;transition:border-color .2s}
.search-wrap input:focus{border-color:var(--indigo)}
.search-icon{position:absolute;left:.7rem;top:50%;transform:translateY(-50%);color:var(--muted);font-size:1rem;pointer-events:none}
select{padding:.6rem .9rem;border:1.5px solid var(--warm);border-radius:8px;font-family:'Sarabun',sans-serif;font-size:.85rem;background:var(--cream);color:var(--text);outline:none;cursor:pointer;transition:border-color .2s}
select:focus{border-color:var(--indigo)}
.count-badge{font-size:.8rem;color:var(--muted);white-space:nowrap;margin-left:auto}
/* GRID */
.grid{max-width:960px;margin:1.5rem auto;padding:0 1.5rem 3rem;display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:1rem}
/* CARD */
.card{background:#fff;border-radius:12px;border:1px solid var(--warm);overflow:hidden;transition:transform .15s,box-shadow .15s;cursor:default}
.card:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(44,62,107,.1)}
.card-top{height:6px;background:linear-gradient(90deg,var(--indigo),var(--teal))}
.card-top.c-C01{background:linear-gradient(90deg,#5B4FCF,#8B6FDF)}
.card-top.c-C02{background:linear-gradient(90deg,#B5613A,#D4825A)}
.card-top.c-C03{background:linear-gradient(90deg,#1E6B5A,#2E9B7A)}
.card-top.c-C04{background:linear-gradient(90deg,#8B5E3C,#B5834A)}
.card-top.c-C05{background:linear-gradient(90deg,#7A4A7A,#9E6A9E)}
.card-top.c-C06{background:linear-gradient(90deg,#C49A3C,#E0B84A)}
.card-top.c-C07{background:linear-gradient(90deg,#4A7A8A,#5A9AAA)}
.card-top.c-C08{background:linear-gradient(90deg,#E84A4A,#FF6A6A)}
.card-top.c-C09{background:linear-gradient(90deg,#2A7AAA,#3A9ACA)}
.card-top.c-C10{background:linear-gradient(90deg,#6A8A4A,#8AAA6A)}
.card-top.c-C11{background:linear-gradient(90deg,#7A7A8A,#9A9AAA)}
.card-body{padding:1rem 1rem .85rem}
.card-name{font-family:'Prompt',sans-serif;font-size:.95rem;font-weight:500;line-height:1.3;color:var(--indigo)}
.card-name-en{font-size:.78rem;color:var(--muted);margin-top:.15rem}
.card-tags{display:flex;flex-wrap:wrap;gap:.35rem;margin-top:.7rem}
.tag{display:inline-flex;align-items:center;gap:.3rem;font-size:.72rem;padding:.2rem .55rem;border-radius:20px;font-weight:500}
.tag-prov{background:var(--light);color:var(--indigo)}
.tag-cat{background:#EEF2F9;color:var(--teal)}
.card-map{display:block;margin-top:.8rem;font-size:.78rem;color:var(--terracotta);text-decoration:none;display:flex;align-items:center;gap:.3rem;font-weight:500}
.card-map:hover{color:var(--indigo)}
/* EMPTY */
.empty{grid-column:1/-1;text-align:center;padding:4rem 1rem;color:var(--muted)}
.empty-icon{font-size:2.5rem;margin-bottom:.5rem}
/* FOOTER */
footer{text-align:center;padding:1.5rem;font-size:.75rem;color:var(--muted);border-top:1px solid var(--warm)}
@media(max-width:520px){
  .controls-inner{flex-direction:column;align-items:stretch}
  select{width:100%}
  .count-badge{margin-left:0}
}
</style>
</head>
<body>

<header>
  <div class="header-inner">
    <div class="logo-row">
      <div class="logo-dot"></div>
      <span style="font-size:.75rem;color:rgba(255,255,255,0.5);letter-spacing:.1em;text-transform:uppercase">Koyori</span>
    </div>
    <h1>ทำเนียบช่างฝีมือ<br>Artisan Directory</h1>
    <p class="subtitle">หัตถศิลป์ล้านนา · Northern Thai Crafts 2019–2025</p>
    <div class="stats-row">
      <div class="stat"><strong>197</strong>ช่างฝีมือ / artisans</div>
      <div class="stat"><strong>9</strong>จังหวัด / provinces</div>
      <div class="stat"><strong>11</strong>หมวดหมู่ / categories</div>
    </div>
  </div>
</header>

<div class="controls">
  <div class="controls-inner">
    <div class="search-wrap">
      <span class="search-icon">🔍</span>
      <input type="text" id="searchInput" placeholder="ค้นหาชื่อช่าง... Search name..." oninput="filterCards()">
    </div>
    <select id="provFilter" onchange="filterCards()">
      <option value="">ทุกจังหวัด · All Provinces</option>
    </select>
    <select id="catFilter" onchange="filterCards()">
      <option value="">ทุกหมวด · All Categories</option>
    </select>
    <select id="yearFilter" onchange="filterCards()">
      <option value="">ทุกปี · All Years</option>
    </select>
    <span class="count-badge" id="countBadge">197 รายการ</span>
  </div>
</div>

<div class="grid" id="grid"></div>

<footer>
  Koyori Artisan Directory &nbsp;·&nbsp; ข้อมูลช่างฝีมือภาคเหนือ 2019–2025
</footer>

const PROVINCES = [...new Set(DATA.map(a=>a.prov_th).filter(Boolean))].sort();
const CATEGORIES = [...new Set(DATA.map(a=>a.cat_th).filter(Boolean))].sort();
const YEARS = [...new Set(DATA.map(a=>a.year).filter(Boolean))].sort((a,b)=>b-a);

const provSel = document.getElementById('provFilter');
const catSel = document.getElementById('catFilter');
const yearSel = document.getElementById('yearFilter');

PROVINCES.forEach(p=>{
  const o=document.createElement('option');o.value=p;
  const en = DATA.find(a=>a.prov_th===p)?.prov_en||'';
  o.textContent=p+(en?' / '+en:'');
  provSel.appendChild(o);
});
CATEGORIES.forEach(c=>{
  const o=document.createElement('option');o.value=c;
  const en = DATA.find(a=>a.cat_th===c)?.cat_en||'';
  o.textContent=c+(en?' · '+en:'');
  catSel.appendChild(o);
});
YEARS.forEach(y=>{
  const o=document.createElement('option');o.value=y;o.textContent=y;
  yearSel.appendChild(o);
});

function escHtml(s){return(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}

function renderCards(list){
  const grid = document.getElementById('grid');
  if(!list.length){
    grid.innerHTML='<div class="empty"><div class="empty-icon">🔍</div><p>ไม่พบข้อมูลที่ค้นหา<br><small>No results found</small></p></div>';
    return;
  }
  grid.innerHTML = list.map(a=>`
    <div class="card">
      <div class="card-top c-${escHtml(a.cat_id)}"></div>
      <div class="card-body">
        <div class="card-name">${escHtml(a.name_th||a.name_en)}</div>
        ${a.name_en&&a.name_th?`<div class="card-name-en">${escHtml(a.name_en)}</div>`:''}
        <div class="card-tags">
          ${a.prov_th?`<span class="tag tag-prov">📍 ${escHtml(a.prov_th)}</span>`:''}
          ${a.cat_th?`<span class="tag tag-cat">${escHtml(a.cat_th)}</span>`:''}
          <span class="tag" style="background:var(--light);color:var(--muted)">${a.year}</span>
        </div>
        ${a.map?`<a class="card-map" href="${escHtml(a.map)}" target="_blank" rel="noopener">🗺️ ดูแผนที่ · View Map</a>`:''}
      </div>
    </div>
  `).join('');
}

function filterCards(){
  const q=(document.getElementById('searchInput').value||'').toLowerCase();
  const prov=provSel.value;
  const cat=catSel.value;
  const year=yearSel.value;
  const list=DATA.filter(a=>{
    if(prov&&a.prov_th!==prov)return false;
    if(cat&&a.cat_th!==cat)return false;
    if(year&&String(a.year)!==year)return false;
    if(q&&!(
      (a.name_th||'').toLowerCase().includes(q)||
      (a.name_en||'').toLowerCase().includes(q)||
      (a.prov_th||'').toLowerCase().includes(q)||
      (a.prov_en||'').toLowerCase().includes(q)||
      (a.cat_th||'').toLowerCase().includes(q)||
      (a.cat_en||'').toLowerCase().includes(q)
    ))return false;
    return true;
  });
  document.getElementById('countBadge').textContent=list.length+' รายการ';
  renderCards(list);
}

renderCards(DATA);
</script>
