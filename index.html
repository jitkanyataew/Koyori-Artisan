<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Koyori — ครูช่างโครงการโคโยริ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+Thai:wght@400;600;700&family=Sarabun:wght@300;400;500;600&family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --red:#C0392B;--red2:#E74C3C;--navy:#1A2A5E;--navy2:#2541A8;
  --white:#fff;--offwhite:#F8F9FF;--light:#EEF1FB;
  --text:#1A1A2E;--muted:#6B7394;--border:#D8DCF0;
}
html{scroll-behavior:smooth}
body{font-family:'Sarabun',sans-serif;background:var(--offwhite);color:var(--text);min-height:100vh}

/* ─── HERO ─── */
header{
  background:var(--navy);
  position:relative;overflow:hidden;
  padding:0;
}
.hero-stripe{
  background:var(--red);height:6px;width:100%;
}
.hero-inner{
  max-width:1100px;margin:0 auto;
  padding:2.5rem 1.5rem 2rem;
  display:flex;align-items:center;gap:2rem;flex-wrap:wrap;
}
.hero-logo-wrap{
  flex-shrink:0;
}
.hero-logo{
  width:72px;height:72px;object-fit:contain;
  filter:drop-shadow(0 2px 8px rgba(0,0,0,0.3));
}
.hero-logo-fallback{
  width:72px;height:72px;border-radius:50%;
  background:linear-gradient(135deg,var(--red),var(--navy2));
  display:flex;align-items:center;justify-content:center;
  font-family:'Montserrat',sans-serif;font-weight:700;font-size:1.3rem;color:#fff;
  letter-spacing:-.02em;
}
.hero-text{flex:1;min-width:200px}
.hero-brand{
  font-family:'Montserrat',sans-serif;font-weight:700;
  font-size:.7rem;letter-spacing:.2em;text-transform:uppercase;
  color:var(--red2);margin-bottom:.4rem;
}
.hero-title{
  font-family:'Noto Serif Thai',serif;
  font-size:clamp(1.5rem,4vw,2.4rem);font-weight:700;
  color:#fff;line-height:1.2;
}
.hero-sub{
  font-size:.85rem;color:rgba(255,255,255,0.6);
  margin-top:.35rem;letter-spacing:.03em;
}
.hero-stats{
  display:flex;gap:1.5rem;margin-top:1.2rem;flex-wrap:wrap;
}
.stat{text-align:center}
.stat-num{
  font-family:'Montserrat',sans-serif;font-weight:700;
  font-size:1.6rem;color:#fff;line-height:1;display:block;
}
.stat-label{font-size:.72rem;color:rgba(255,255,255,0.55);margin-top:.1rem}
.hero-divider{width:1px;height:36px;background:rgba(255,255,255,0.15);align-self:center}

.hero-nav-row{
  background:rgba(0,0,0,0.25);border-top:1px solid rgba(255,255,255,0.08);
}
.hero-nav{
  max-width:1100px;margin:0 auto;padding:.5rem 1.5rem;
  display:flex;gap:.5rem;flex-wrap:wrap;
}
.nav-btn{
  display:inline-flex;align-items:center;gap:.4rem;
  padding:.4rem .9rem;border-radius:6px;font-size:.8rem;
  text-decoration:none;font-family:'Montserrat',sans-serif;font-weight:600;
  transition:all .2s;
}
.nav-btn-active{background:var(--red);color:#fff}
.nav-btn-ghost{color:rgba(255,255,255,0.7);background:transparent}
.nav-btn-ghost:hover{background:rgba(255,255,255,0.1);color:#fff}

/* ─── CONTROLS ─── */
.controls{
  position:sticky;top:0;z-index:100;
  background:#fff;border-bottom:2px solid var(--border);
  box-shadow:0 2px 16px rgba(26,42,94,.08);
}
.controls-inner{
  max-width:1100px;margin:0 auto;
  padding:.75rem 1.5rem;
  display:flex;flex-wrap:wrap;gap:.6rem;align-items:center;
}
.search-wrap{position:relative;flex:1;min-width:200px}
.search-icon{
  position:absolute;left:.75rem;top:50%;transform:translateY(-50%);
  color:var(--muted);font-size:.9rem;pointer-events:none;
}
.search-wrap input{
  width:100%;padding:.6rem .75rem .6rem 2.2rem;
  border:1.5px solid var(--border);border-radius:8px;
  font-family:'Sarabun',sans-serif;font-size:.9rem;
  background:var(--offwhite);color:var(--text);outline:none;
  transition:border-color .2s;
}
.search-wrap input:focus{border-color:var(--navy2)}
select{
  padding:.6rem .85rem;border:1.5px solid var(--border);border-radius:8px;
  font-family:'Sarabun',sans-serif;font-size:.82rem;
  background:var(--offwhite);color:var(--text);outline:none;cursor:pointer;
  transition:border-color .2s;
}
select:focus{border-color:var(--navy2)}
.count-badge{
  font-size:.78rem;color:var(--muted);margin-left:auto;white-space:nowrap;
  font-family:'Montserrat',sans-serif;
}

/* ─── GRID ─── */
.grid{
  max-width:1100px;margin:1.5rem auto 3rem;
  padding:0 1.5rem;
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(280px,1fr));
  gap:1rem;
}

/* ─── CARD ─── */
.card{
  background:#fff;border-radius:14px;
  border:1px solid var(--border);overflow:hidden;
  transition:transform .15s,box-shadow .15s;
  cursor:default;display:flex;flex-direction:column;
}
.card:hover{transform:translateY(-3px);box-shadow:0 10px 30px rgba(26,42,94,.12)}
.card-accent{height:4px;background:var(--navy2)}
.card-accent.cat-C01{background:linear-gradient(90deg,#6A0DAD,#9B59B6)}
.card-accent.cat-C02{background:linear-gradient(90deg,#C0392B,#E74C3C)}
.card-accent.cat-C03{background:linear-gradient(90deg,#27AE60,#2ECC71)}
.card-accent.cat-C04{background:linear-gradient(90deg,#795548,#A1887F)}
.card-accent.cat-C05{background:linear-gradient(90deg,#E91E63,#F06292)}
.card-accent.cat-C06{background:linear-gradient(90deg,#F39C12,#F1C40F)}
.card-accent.cat-C07{background:linear-gradient(90deg,#00BCD4,#4DD0E1)}
.card-accent.cat-C08{background:linear-gradient(90deg,#FF5722,#FF8A65)}
.card-accent.cat-C09{background:linear-gradient(90deg,#1565C0,#42A5F5)}
.card-accent.cat-C10{background:linear-gradient(90deg,#558B2F,#8BC34A)}
.card-accent.cat-C11{background:linear-gradient(90deg,#455A64,#78909C)}

/* Portrait area */
.card-img{
  height:160px;background:#F0F3FF;position:relative;overflow:hidden;
  display:flex;align-items:center;justify-content:center;
}
.card-img img{
  width:100%;height:100%;object-fit:cover;
  transition:transform .3s;
}
.card:hover .card-img img{transform:scale(1.04)}
.card-img-placeholder{
  width:64px;height:64px;border-radius:50%;
  background:linear-gradient(135deg,var(--navy) 0%,var(--navy2) 100%);
  display:flex;align-items:center;justify-content:center;
  font-family:'Montserrat',sans-serif;font-weight:700;
  font-size:1.5rem;color:#fff;
}
.card-year-badge{
  position:absolute;top:.5rem;right:.5rem;
  background:rgba(26,42,94,.85);color:#fff;
  font-size:.65rem;font-family:'Montserrat',sans-serif;font-weight:600;
  padding:.15rem .45rem;border-radius:4px;letter-spacing:.05em;
}

/* Product thumbnail */
.card-product{
  height:80px;background:#F8F9FF;border-top:1px solid var(--border);
  display:flex;align-items:center;justify-content:center;
  overflow:hidden;position:relative;
}
.card-product img{width:100%;height:100%;object-fit:cover}
.card-product-label{
  position:absolute;left:.5rem;bottom:.35rem;
  background:rgba(0,0,0,.55);color:#fff;
  font-size:.6rem;padding:.1rem .35rem;border-radius:3px;
  font-family:'Montserrat',sans-serif;
}

/* Card body */
.card-body{padding:.9rem 1rem .8rem;flex:1;display:flex;flex-direction:column}
.card-name{
  font-family:'Noto Serif Thai',serif;font-weight:600;
  font-size:.95rem;color:var(--navy);line-height:1.3;
}
.card-name-en{font-size:.72rem;color:var(--muted);margin-top:.15rem}
.card-tags{display:flex;flex-wrap:wrap;gap:.3rem;margin-top:.6rem}
.tag{
  display:inline-flex;align-items:center;gap:.25rem;
  font-size:.68rem;padding:.18rem .5rem;border-radius:20px;font-weight:600;
}
.tag-prov{background:var(--light);color:var(--navy)}
.tag-cat{background:#FEF3F2;color:var(--red)}
.tag-id{background:#F5F5F5;color:#888;font-family:'Montserrat',sans-serif}

/* Contact row */
.card-contacts{
  display:flex;flex-wrap:wrap;gap:.35rem;
  margin-top:.65rem;padding-top:.6rem;
  border-top:1px dashed var(--border);
  margin-top:auto;
}
.contact-btn{
  display:inline-flex;align-items:center;gap:.3rem;
  font-size:.72rem;text-decoration:none;
  padding:.25rem .6rem;border-radius:6px;font-weight:500;
  transition:all .15s;
}
.btn-map{background:#EEF1FB;color:var(--navy2)}
.btn-map:hover{background:var(--navy2);color:#fff}
.btn-fb{background:#FEF3F2;color:var(--red)}
.btn-fb:hover{background:var(--red);color:#fff}
.btn-phone{background:#F0FFF4;color:#1B5E20}
.btn-phone:hover{background:#1B5E20;color:#fff}

/* ─── EMPTY ─── */
.empty{
  grid-column:1/-1;text-align:center;
  padding:4rem 1rem;color:var(--muted);
}
.empty-icon{font-size:3rem;margin-bottom:.5rem}

/* ─── FOOTER ─── */
footer{
  text-align:center;padding:1.5rem;
  font-size:.73rem;color:var(--muted);
  border-top:1px solid var(--border);
  background:#fff;
}

/* ─── RESPONSIVE ─── */
@media(max-width:560px){
  .controls-inner{flex-direction:column;align-items:stretch}
  select,.count-badge{width:100%;margin-left:0}
  .hero-inner{flex-direction:column;align-items:flex-start;gap:1rem}
  .hero-stats{gap:1rem}
}

/* MODAL */
.modal-overlay{position:fixed;inset:0;z-index:2000;background:rgba(10,15,40,.85);backdrop-filter:blur(6px);display:flex;align-items:center;justify-content:center;padding:1rem;opacity:0;pointer-events:none;transition:opacity .25s}
.modal-overlay.open{opacity:1;pointer-events:all}
.modal-box{background:#fff;border-radius:16px;overflow:hidden;max-width:820px;width:100%;max-height:90vh;display:flex;flex-direction:column;box-shadow:0 24px 60px rgba(0,0,0,.4);transform:translateY(20px);transition:transform .25s;position:relative}
.modal-overlay.open .modal-box{transform:translateY(0)}
.modal-top{height:5px;background:linear-gradient(90deg,var(--navy),var(--red))}
.modal-close{position:absolute;top:.75rem;right:.75rem;background:rgba(0,0,0,.15);border:none;cursor:pointer;width:32px;height:32px;border-radius:50%;font-size:1rem;color:#fff;display:flex;align-items:center;justify-content:center;transition:background .2s;z-index:10}
.modal-close:hover{background:var(--red)}
.modal-imgs{display:grid;grid-template-columns:1fr 1fr;background:#F0F3FF;max-height:320px;overflow:hidden}
.modal-imgs.single{grid-template-columns:1fr}
.modal-img{width:100%;height:280px;object-fit:cover}
.modal-img-label{font-size:.65rem;font-family:'Montserrat',sans-serif;font-weight:600;color:var(--muted);padding:.3rem .5rem;text-align:center;background:#F0F3FF;letter-spacing:.05em;text-transform:uppercase}
.modal-body{padding:1.25rem 1.5rem 1.5rem;overflow-y:auto}
.modal-name{font-family:'Noto Serif Thai',serif;font-weight:700;font-size:1.2rem;color:var(--navy);margin-bottom:.15rem}
.modal-name-en{font-size:.82rem;color:var(--muted);margin-bottom:.8rem}
.modal-tags{display:flex;flex-wrap:wrap;gap:.35rem;margin-bottom:1rem}
.modal-contacts{display:flex;flex-wrap:wrap;gap:.5rem;margin-top:1rem;padding-top:.75rem;border-top:1px solid var(--border)}
</style>
</head>

<!-- HEADER -->

  <div class="hero-inner">

  <div class="hero-nav-row">

      <a href="index.html" class="nav-btn nav-btn-active">🗂️ ทำเนียบ Directory</a>

</header>

<!-- CONTROLS -->
<div class="controls">

  </div>
</div>

<!-- GRID -->
<div class="grid" id="grid"></div>

<!-- FOOTER -->
<footer>
  Koyori Project · โครงการโคโยริ &nbsp;|&nbsp; ทำเนียบครูช่างโครงการโคโยริ 2019–2025
</footer>

const PROVS = [...new Set(DATA.map(a=>a.prov_th).filter(Boolean))].sort();
const CATS  = [...new Set(DATA.map(a=>a.cat_th).filter(Boolean))].sort();
const YEARS = [...new Set(DATA.map(a=>a.year).filter(Boolean))].sort((a,b)=>b-a);

const provSel = document.getElementById('provFilter');
const catSel  = document.getElementById('catFilter');
const yearSel = document.getElementById('yearFilter');

PROVS.forEach(p=>{
  const en = DATA.find(a=>a.prov_th===p)?.prov_en||'';
  provSel.innerHTML += `<option value="${esc(p)}">${p}${en?' · '+en:''}</option>`;
});
CATS.forEach(c=>{
  const en = DATA.find(a=>a.cat_th===c)?.cat_en||'';
  catSel.innerHTML += `<option value="${esc(c)}">${c}${en?' · '+en:''}</option>`;
});
YEARS.forEach(y=>{
  yearSel.innerHTML += `<option value="${y}">${y}</option>`;
});

function esc(s){return(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}

function initials(name_th, name_en){
  const n = name_th || name_en || '?';
  const words = n.replace(/นาย|นาง|นางสาว|ว่าที่|ร\.ต\.|หญิง|มร\.|mr\.|mrs\.|miss/gi,'').trim();
  return words.charAt(0) || '?';
}

function cleanFb(fb){
  if(!fb||fb==='-'||fb.length>200) return '';
  if(fb.startsWith('http')) return fb;
  return '';
}

function renderCards(list){
  const grid = document.getElementById('grid');
  if(!list.length){
    grid.innerHTML = `<div class="empty"><div class="empty-icon">🔍</div><p>ไม่พบข้อมูลที่ค้นหา<br><small>No results found</small></p></div>`;
    return;
  }
  grid.innerHTML = list.map(a => {
    const portrait = imgUrl(a.id, 'portrait');
    const product  = imgUrl(a.id, 'product');
    const init     = initials(a.name_th, a.name_en);
    const fb       = cleanFb(a.fb);
    const hasPhone = a.phone && a.phone.length > 3;

    return `
<div class="card" onclick="openModal('${esc(a.id)}')" style="cursor:pointer">
  <div class="card-accent ${a.cat_id ? 'cat-'+esc(a.cat_id) : ''}"></div>

  <!-- Portrait -->
  <div class="card-img">
    ${portrait ? `<img src="${portrait}" alt="${esc(a.name_th||a.name_en)}" onerror="this.style.display='none';this.parentNode.querySelector('.card-img-placeholder').style.display='flex'">` : ''}
    <div class="card-img-placeholder" style="${portrait ? 'display:none' : 'display:flex'}">${esc(init)}</div>
    <span class="card-year-badge">${a.year}</span>
  </div>

  <!-- Product -->
  ${product ? `<div class="card-product">
    <img src="${product}" alt="ผลงาน ${esc(a.name_th||a.name_en)}" onerror="this.parentNode.style.display='none'">
    <span class="card-product-label">ผลงาน</span>
  </div>` : ''}

  <div class="card-body">
    <div class="card-name">${esc(a.name_th || a.name_en)}</div>
    ${a.name_en && a.name_th ? `<div class="card-name-en">${esc(a.name_en)}</div>` : ''}

    <div class="card-tags">
      ${a.prov_th ? `<span class="tag tag-prov">📍 ${esc(a.prov_th)}</span>` : ''}
      ${a.cat_th  ? `<span class="tag tag-cat">${esc(a.cat_th)}</span>` : ''}
      <span class="tag tag-id">${esc(a.id)}</span>
    </div>

    <div class="card-contacts">
      ${a.map ? `<a href="${esc(a.map)}" target="_blank" rel="noopener" class="contact-btn btn-map">🗺️ แผนที่</a>` : ''}
      ${hasPhone ? `<a href="tel:${esc(a.phone.replace(/\s/g,''))}" class="contact-btn btn-phone">📞 ${esc(a.phone)}</a>` : ''}
      ${fb ? `<a href="${esc(fb)}" target="_blank" rel="noopener" class="contact-btn btn-fb">📘 Facebook</a>` : ''}
    </div>
  </div>
</div>`;
  }).join('');
}

function filterCards(){
  const q    = (document.getElementById('searchInput').value||'').toLowerCase();
  const prov = provSel.value;
  const cat  = catSel.value;
  const year = yearSel.value;
  const list = DATA.filter(a=>{
    if(prov && a.prov_th !== prov) return false;
    if(cat  && a.cat_th  !== cat)  return false;
    if(year && String(a.year) !== year) return false;
    if(q && !([a.name_th,a.name_en,a.prov_th,a.prov_en,a.cat_th,a.cat_en,a.id]
              .join(' ').toLowerCase().includes(q))) return false;
    return true;
  });
  document.getElementById('countBadge').textContent = list.length + ' รายการ';
  renderCards(list);
}

renderCards(DATA);
</script>

<div class="modal-overlay" id="modalOverlay" onclick="if(event.target===this)closeModal()">
  <div class="modal-box">
    <div class="modal-top"></div>
    <button class="modal-close" onclick="closeModal()">&#x2715;</button>
    <div class="modal-imgs" id="modalImgs"></div>
    <div class="modal-body">
      <div class="modal-name" id="modalName"></div>
      <div class="modal-name-en" id="modalNameEn"></div>
      <div class="modal-tags" id="modalTags"></div>
      <div class="modal-contacts" id="modalContacts"></div>
    </div>
  </div>
</div>
<script>
var _artisanMap={};
DATA.forEach(function(a){_artisanMap[a.id]=a;});

function openModal(id){
  var a=_artisanMap[id];
  if(!a)return;
  var portrait=IMGS[a.id]&&IMGS[a.id].portrait?IMGS[a.id].portrait:null;
  var product=IMGS[a.id]&&IMGS[a.id].product?IMGS[a.id].product:null;
  var mi=document.getElementById('modalImgs');
  if(portrait&&product){
    mi.className='modal-imgs';
    mi.innerHTML='<div><img class="modal-img" src="'+portrait+'" onerror="this.parentNode.style.display=\'none\'"><div class="modal-img-label">ครูช่าง</div></div><div><img class="modal-img" src="'+product+'" onerror="this.parentNode.style.display=\'none\'"><div class="modal-img-label">ผลงาน</div></div>';
  } else if(portrait||product){
    mi.className='modal-imgs single';
    var u=portrait||product;
    var l=portrait?'ครูช่าง':'ผลงาน';
    mi.innerHTML='<div><img class="modal-img" src="'+u+'"><div class="modal-img-label">'+l+'</div></div>';
  } else {
    mi.className='modal-imgs single';
    mi.innerHTML='<div style="height:80px;display:flex;align-items:center;justify-content:center;color:#999;font-size:.8rem">ยังไม่มีรูปภาพ</div>';
  }
  document.getElementById('modalName').textContent=a.name_th||a.name_en||'';
  document.getElementById('modalNameEn').textContent=(a.name_en&&a.name_th)?a.name_en:'';
  var tags='';
  if(a.prov_th)tags+='<span class="tag tag-prov">&#128205; '+a.prov_th+(a.prov_en?' &middot; '+a.prov_en:'')+'</span>';
  if(a.cat_th)tags+='<span class="tag tag-cat">'+a.cat_th+(a.cat_en?' &middot; '+a.cat_en:'')+'</span>';
  tags+='<span class="tag tag-id">'+a.id+'</span>';
  tags+='<span class="tag" style="background:var(--light);color:var(--muted)">&#128197; '+a.year+'</span>';
  document.getElementById('modalTags').innerHTML=tags;
  var c='';
  if(a.map)c+='<a href="'+a.map+'" target="_blank" class="contact-btn btn-map">&#128506; ดูแผนที่</a>';
  if(a.phone&&a.phone.length>3)c+='<a href="tel:'+a.phone.replace(/\s/g,'')+'" class="contact-btn btn-phone">&#128222; '+a.phone+'</a>';
  if(a.fb&&a.fb.indexOf('http')===0)c+='<a href="'+a.fb+'" target="_blank" class="contact-btn btn-fb">&#128216; Facebook</a>';
  var mc=document.getElementById('modalContacts');
  mc.innerHTML=c;mc.style.display=c?'flex':'none';
  document.getElementById('modalOverlay').classList.add('open');
  document.body.style.overflow='hidden';
}
function closeModal(){
  document.getElementById('modalOverlay').classList.remove('open');
  document.body.style.overflow='';
}
document.addEventListener('keydown',function(e){if(e.key==='Escape')closeModal();});
</script>
</body>
